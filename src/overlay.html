<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>Character zone</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;cursor:crosshair;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}canvas{position:fixed;inset:0}
#tip{position:fixed;left:50%;top:26px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:#14131fee;border:1px solid #ffffff2a;color:#f1eefc;font-size:14px;box-shadow:0 8px 28px #0008;text-align:center;line-height:1.5;pointer-events:none}
#tip b{color:#b9a8ff}#tip.bad{border-color:#ff6b81;color:#ffd5db}</style></head>
<body><canvas id="c"></canvas><div id="tip"><b>Draw your character's zone.</b> Drag a rectangle where your friend may roam.<br><span id="hint">Enter to confirm · Esc to cancel · drag again to redraw</span></div><script src="overlay.js"></script></body></html>
